model_name: XSimGCL
dataset_name: kion
dataset_path: ./datasets

# Model parameters
embedding_dim: 64
XSimGCL_n_layers: 3
decay: 0.0001
cl_rate: 0.9
temp: 0.2
noise_scale: 0.1
proto_reg: 0.1
n_clusters: 10

# Training parameters
seed: 42
use_gpu: true
learning_rate: 0.001
batch_size: 2048
epochs: 50
eval_freq: 5
eval_batch_size: 1024
topk: [10, 20, 50]
num_workers: 4

# Logging and checkpointing
log_dir: ./logs/XSimGCL
checkpoint_dir: ./checkpoints/XSimGCL
