model_name: TwinCL
dataset_name: kion
dataset_path: ./datasets

# Model parameters
embedding_dim: 64
TwinCL_n_layers: 3
decay: 0.0001
mcl_rate: 0.9  # Weight for momentum contrastive loss
temp: 0.2  # Temperature for contrastive loss
gamma: 0.2  # Weight for uniformity loss
m: 0.9  # Momentum coefficient for key encoder update

# Training parameters
seed: 42
use_gpu: true
learning_rate: 0.001
batch_size: 2048
epochs: 50
eval_freq: 5
eval_batch_size: 1024
topk: [10, 20, 50]
num_workers: 4

# Logging and checkpointing
log_dir: ./logs/TwinCL
checkpoint_dir: ./checkpoints/TwinCL