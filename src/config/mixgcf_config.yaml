model_name: MixGCF
dataset_name: kion
dataset_path: ./datasets

# MixGCF specific parameters
MixGCF_n_layers: 3
embedding_dim: 64
decay: 0.0001
n_negs: 64

# Training parameters
seed: 42
use_gpu: true
learning_rate: 0.001
batch_size: 2048
epochs: 50
eval_freq: 5
eval_batch_size: 1024
topk: [10, 20, 50]
num_workers: 4

# Logging and checkpointing
log_dir: ./logs/MixGCF
checkpoint_dir: ./checkpoints/MixGCF