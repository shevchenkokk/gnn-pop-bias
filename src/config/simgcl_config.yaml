model_name: SimGCL
dataset_name: lastfm
dataset_path: ./datasets

# Model parameters
embedding_dim: 64
SimGCL_n_layers: 3
decay: 0.0001
cl_rate: 0.2  # Weight for contrastive loss
temp: 0.2  # Temperature for contrastive loss
noise_scale: 0.1  # Scale of noise for augmentation

# Training parameters
seed: 42
use_gpu: false
learning_rate: 0.001
batch_size: 2048
epochs: 50
eval_freq: 5
eval_batch_size: 1024
topk: [10, 20, 50]
num_workers: 4

# Logging and checkpointing
log_dir: ./logs/SimGCL
checkpoint_dir: ./checkpoints/SimGCL
